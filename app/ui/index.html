<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DataMover</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ═══ LOGIN ════════════════════════════════════════════════════════ -->
  <div id="login-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#3b82f6"/>
          <path d="M7 16h18M19 10l6 6-6 6" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="login-brand-name">DataMover</div>
          <div class="login-brand-sub">Managed File Transfer</div>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div class="field">
          <label for="login-username">Username</label>
          <input id="login-username" type="text"
                 autocomplete="username" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password"
                 autocomplete="current-password" required>
        </div>
        <div id="login-err" class="alert alert-error hidden"></div>
        <button id="login-btn" class="btn btn-primary w-full" type="submit">
          Sign in
        </button>
      </form>
    </div>
  </div>

  <!-- ═══ FORCED PASSWORD CHANGE ══════════════════════════════════════════ -->
  <!-- Shown instead of the app shell whenever the logged-in user's record has
       mustChangePassword set — no sidebar, no nav, no way to navigate around it. -->
  <div id="setup-screen" class="login-screen hidden">
    <div class="login-card">
      <div class="login-brand">
        <svg width="40" height="40" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#3b82f6"/>
          <path d="M7 16h18M19 10l6 6-6 6" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <div>
          <div class="login-brand-name">DataMover</div>
          <div class="login-brand-sub">Password change required</div>
        </div>
      </div>

      <p class="setup-intro">
        This account is still using its initial default password. Choose a new
        password (at least 12 characters, and not the default) before continuing.
      </p>

      <form id="setup-form" novalidate>
        <div class="field">
          <label for="setup-password">New password</label>
          <input id="setup-password" type="password"
                 autocomplete="new-password" required>
        </div>
        <div class="field">
          <label for="setup-password-confirm">Confirm new password</label>
          <input id="setup-password-confirm" type="password"
                 autocomplete="new-password" required>
        </div>
        <div id="setup-err" class="alert alert-error hidden"></div>
        <button id="setup-btn" class="btn btn-primary w-full" type="submit">
          Change password
        </button>
      </form>
    </div>
  </div>

  <!-- ═══ APP SHELL ════════════════════════════════════════════════════ -->
  <div id="app" class="app hidden">

    <aside class="sidebar">
      <div class="sidebar-brand">
        <svg width="26" height="26" viewBox="0 0 32 32" fill="none">
          <rect width="32" height="32" rx="8" fill="#3b82f6"/>
          <path d="M7 16h18M19 10l6 6-6 6" stroke="white" stroke-width="2.5"
                stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span>DataMover</span>
      </div>

      <nav id="sidebar-nav" class="sidebar-nav">
        <!-- Injected by buildNav() -->
      </nav>

      <div class="sidebar-footer">
        <button id="logout-btn" class="sidebar-logout-btn">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"
               stroke="currentColor" stroke-width="1.6"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M13 3h4a1 1 0 011 1v12a1 1 0 01-1 1h-4M9 14l4-4-4-4M13 10H3"/>
          </svg>
          Log out
        </button>
      </div>
    </aside>

    <div class="main-wrap">
      <header class="topbar">
        <h1 id="view-title" class="view-title">Dashboard</h1>
        <div class="topbar-end">
          <span id="status-pill" class="status-pill online">Online</span>
          <div class="user-chip">
            <div id="user-avatar" class="user-avatar">A</div>
            <span id="user-name" class="user-name"></span>
          </div>
        </div>
      </header>

      <main id="view" class="view-area">
        <!-- Active view rendered here -->
      </main>
    </div>

  </div>

  <script src="app.js"></script>
</body>
</html>
